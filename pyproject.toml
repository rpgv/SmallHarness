[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallharness"
version = "1.0.0"
description = "A rigid harness that offloads context, tool and plan management from small local models (LiteRT-LM)."
readme = "README.md"
requires-python = ">=3.11"
# The harness itself is standard library only; each extra adds one capability.
dependencies = []

[project.optional-dependencies]
litert = ["litert-lm>=0.18.1"]     # the `litert-lm` CLI (`litert-lm serve`) and its Python API
ram = ["psutil"]                   # RAM-aware sizing of model instances
embed = ["fastembed>=0.9.0"]       # search by meaning in the knowledge base
all = ["smallharness[litert,ram,embed]"]

[project.scripts]
smallharness = "smallharness.cli:main"

[tool.setuptools.packages.find]
include = ["smallharness*"]

[tool.setuptools.package-data]
# Not packages, so listed here: the built-in tool files and the web interface's page.
smallharness = ["tools/builtin/*.py", "web/static/*"]
